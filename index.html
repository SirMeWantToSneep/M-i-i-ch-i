<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Quick Question... 💌</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      padding: 20px 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.92);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 450px;
      width: 90%;
      position: relative;
    }

    .gif-container img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    h1 {
      color: #d63384;
      font-size: 1.5rem;
      margin-bottom: 20px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      position: relative;
      min-height: 60px;
    }

    button {
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease, font-size 0.2s ease, background-color 0.2s ease;
    }

    #yesBtn {
      background-color: #28a745;
      color: white;
      z-index: 10;
    }

    #yesBtn:hover {
      background-color: #218838;
    }

    #noBtn {
      background-color: #dc3545;
      color: white;
      position: relative;
    }

    .options-form {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
      text-align: left;
    }

    .options-form label {
      font-weight: 600;
      color: #444;
      font-size: 0.9rem;
    }

    .options-form select, .options-form input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 4px;
      font-size: 0.9rem;
    }

    .datetime-group {
      display: flex;
      gap: 10px;
    }

    .datetime-group > div {
      flex: 1;
    }

    .submit-btn {
      background-color: #d63384;
      color: white;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-size: 1rem;
    }

    .submit-btn:hover {
      background-color: #b8256f;
    }

    #statusMsg {
      margin-top: 15px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #d63384;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="gif-container">
      <img id="displayGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHN2OHZ4ZnI2ZGZwdXJpMnU3Nm5yc3M4bTNibjdvOW9iM3IyeCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cLS1cf3xm38g7A394B/giphy.gif" alt="Cute gif">
    </div>

    <h1 id="questionText">Bạn lớn có đồng ý đi date với bạn nhỏ khum? 🥺</h1>

    <div class="btn-group" id="buttonGroup">
      <button id="yesBtn">Đồng ý ❤️</button>
      <button id="noBtn">Khum 💔</button>
    </div>

    <!-- LINK FORMSPREE CỦA BẠN ĐÃ ĐƯỢC GẮN VÀO BÊN DƯỚI -->
    <form class="options-form" id="optionsForm" action="https://formspree.io/f/xkjgyrbk" method="POST">
      
      <div>
        <label for="food">1. Chúng mình đi ăn gì nha?</label>
        <select id="food" name="Món ăn" required>
          <option value="Đồ nướng / BBQ">Đồ nướng / BBQ 🥩</option>
          <option value="Lẩu (Kichi, Haidilao...)">Lẩu 🍲</option>
          <option value="Sushi / Đồ Nhật">Sushi / Đồ Nhật 🍣</option>
          <option value="Pasta / Pizza / Đồ Ý">Pasta / Pizza 🍝</option>
          <option value="Bún đậu / Đồ cuốn">Bún đậu mắm tôm 🍲</option>
          <option value="Ăn vặt / Xiên bẩn">Ăn vặt vỉa hè / Xiên bẩn 🍢</option>
          <option value="Tùy bạn nhỏ chọn hết">Tùy bạn nhỏ chọn hết! ✨</option>
        </select>
      </div>

      <div>
        <label for="activity">2. Ăn xong mình đi đâu tiếp?</label>
        <select id="activity" name="Hoạt động" required>
          <option value="Đi café trò chuyện / chụp ảnh">Đi café chụp ảnh ☕</option>
          <option value="Đi xem phim">Đi xem phim rạp 🍿</option>
          <option value="Lượn phố / Dạo hồ hóng gió">Lượn phố hóng gió 🛵</option>
          <option value="Đi gắp thú / Chơi Arcade / Bida">Chơi gắp thú / Arcade / Bida 🎮</option>
          <option value="Đi tô tượng / Làm đồ workshop">Đi tô tượng / Làm workshop 🎨</option>
          <option value="Về nhà nghỉ ngơi sớm">Thôi ăn xong về nghỉ sớm nè 🏠</option>
        </select>
      </div>

      <div class="datetime-group">
        <div>
          <label for="date">3. Chọn ngày rảnh:</label>
          <input type="date" id="date" name="Ngày hẹn" required>
        </div>
        <div>
          <label for="time">Giờ đón:</label>
          <input type="time" id="time" name="Giờ đón" value="19:00" required>
        </div>
      </div>

      <div>
        <label for="note">4. Lời nhắn cho bạn nhỏ (nếu có):</label>
        <input type="text" id="note" name="Lời nhắn" placeholder="VD: Nhớ đón đúng giờ, đem theo áo khoác...">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Xác nhận lịch hẹn ✨</button>
    </form>

    <div id="statusMsg"></div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const questionText = document.getElementById('questionText');
    const displayGif = document.getElementById('displayGif');
    const buttonGroup = document.getElementById('buttonGroup');
    const optionsForm = document.getElementById('optionsForm');
    const statusMsg = document.getElementById('statusMsg');

    const noMessages = [
      "Ơ kìa, suy nghĩ lại đi mà... 🥺",
      "Thật sự không đi sao? 😭",
      "Năn nỉ bạn lớn luôn đó! 🙇‍♂️",
      "Nút 'Khum' bé tẹo rồi kìa, chọn bên kia đi!",
      "Hết bấm được nút Khum rồi nha 😜"
    ];

    let noCount = 0;
    let yesScale = 1;
    let noScale = 1;

    document.getElementById('date').valueAsDate = new Date();

    function handleNoInteraction() {
      if (noCount < noMessages.length) {
        questionText.innerText = noMessages[noCount];
        noCount++;
      }

      yesScale += 0.35;
      yesBtn.style.transform = `scale(${yesScale})`;

      noScale -= 0.18;
      if (noScale < 0.2) {
        noBtn.style.display = 'none';
      } else {
        noBtn.style.transform = `scale(${noScale})`;
      }

      if (noCount >= 2) {
        const x = (Math.random() - 0.5) * 200;
        const y = (Math.random() - 0.5) * 150;
        noBtn.style.position = 'absolute';
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
      }
    }

    noBtn.addEventListener('mouseover', handleNoInteraction);
    noBtn.addEventListener('click', handleNoInteraction);

    yesBtn.addEventListener('click', () => {
      displayGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHN2OHZ4ZnI2ZGZwdXJpMnU3Nm5yc3M4bTNibjdvOW9iM3IyeCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/G96zgIcQn1L2xpmdvu/giphy.gif";
      questionText.innerText = "YAYYY! Biết thế nào bạn lớn cũng đồng ý mà 🥰";
      buttonGroup.style.display = 'none';
      optionsForm.style.display = 'flex';
    });

    optionsForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "Đang gửi lịch hẹn...";
      submitBtn.disabled = true;

      const formData = new FormData(this);

      try {
        const response = await fetch(this.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          questionText.innerText = "Lịch hẹn đã được chốt! Chờ bạn nhỏ sang đón nha 🚗💨";
          optionsForm.style.display = 'none';
          statusMsg.innerHTML = `
            <div style="text-align: center; color: #333; line-height: 1.6; background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #ffe3e3;">
              <p>📍 <strong>Món ăn:</strong> ${formData.get('Món ăn')}</p>
              <p>📍 <strong>Kèo tiếp theo:</strong> ${formData.get('Hoạt động')}</p>
              <p>⏰ <strong>Thời gian:</strong> ${formData.get('Giờ đón')} - Ngày ${formData.get('Ngày hẹn')}</p>
              ${formData.get('Lời nhắn') ? `<p>💬 <strong>Lời nhắn:</strong> "${formData.get('Lời nhắn')}"</p>` : ''}
              <br>
              <p style="color: #d63384; font-weight: bold;">Hẹn gặp bạn lớn nha! ❤️</p>
            </div>
          `;
        } else {
          alert("Có lỗi xảy ra khi gửi, bạn thử lại giúp mình nhé!");
          submitBtn.innerText = "Xác nhận lịch hẹn ✨";
          submitBtn.disabled = false;
        }
      } catch (error) {
        alert("Lỗi kết nối! Vui lòng kiểm tra lại mạng.");
        submitBtn.innerText = "Xác nhận lịch hẹn ✨";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
